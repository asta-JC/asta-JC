name: Update monthly contributions
on:
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monthly-contributions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draw current month
        shell: python
        run: |
          import calendar
          from datetime import datetime, timedelta
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          class Contributions(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.days = {}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'data-date' in attrs and 'data-level' in attrs:
                      self.days[attrs['data-date']] = int(attrs['data-level'])

          today = datetime.now(ZoneInfo('Asia/Tashkent')).date()
          start = today.replace(day=1)
          url = f'https://github.com/users/asta-JC/contributions?from={start}&to={today}'
          request = Request(url, headers={'User-Agent': 'asta-JC-profile-calendar'})
          with urlopen(request, timeout=30) as response:
              source = response.read().decode('utf-8')
          parser = Contributions()
          parser.feed(source)
          days = [start + timedelta(days=i) for i in range(today.day)]
          if any(day.isoformat() not in parser.days for day in days):
              raise ValueError('Incomplete contribution calendar')
          offset = (start.weekday() + 1) % 7
          total = calendar.monthrange(today.year, today.month)[1]
          weeks = (offset + total + 6) // 7
          width = max(236, 86 + weeks * 25)
          colors = ['#161b22', '#0e4429', '#006d32', '#26a641', '#39d353']
          svg = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="278" viewBox="0 0 {width} 278" role="img" aria-labelledby="title desc">',
                 f'<title id="title">{today:%B %Y} contributions</title>',
                 '<desc id="desc">One month of contributions. Columns are weeks; rows run Sunday to Saturday.</desc>',
                 f'<rect x="0.5" y="0.5" width="{width-1}" height="277" rx="8" fill="#0d1117" stroke="#3d444d"/>',
                 '<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#9198a1">',
                 f'<text x="65" y="30" fill="#f0f6fc" font-size="16">{today:%b %Y}</text>']
          for row, label in [(1, 'Mon'), (3, 'Wed'), (5, 'Fri')]:
              svg.append(f'<text x="18" y="{58+row*25}">{label}</text>')
          for day in days:
              index = offset + day.day - 1
              level = parser.days[day.isoformat()]
              if not 0 <= level <= 4:
                  raise ValueError('Invalid contribution level')
              svg.append(f'<rect x="{65+index//7*25}" y="{44+index%7*25}" width="20" height="20" rx="3" fill="{colors[level]}"><title>{day}: contribution level {level} of 4</title></rect>')
          svg.append('<text x="18" y="249">Less</text>')
          for i, color in enumerate(colors):
              svg.append(f'<rect x="{53+i*23}" y="234" width="18" height="18" rx="3" fill="{color}"/>')
          svg.append('<text x="174" y="249">More</text></g></svg>')
          output = Path('assets/monthly-contributions.svg')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(chr(10).join(svg) + chr(10))
      - name: Save calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/monthly-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update monthly contribution calendar'
            git push
          fi
